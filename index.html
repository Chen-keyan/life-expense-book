<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活费账本 · 拒绝糊涂账</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<main id="app"
      data-expense-cats='{{ expense_cats | tojson }}'
      data-income-cats='{{ income_cats | tojson }}'>

  <!-- 顶栏 -->
  <header class="bar">
    <div class="brand">
      <span class="brand-mark">账</span>
      <span class="brand-text">
        <strong>生活费账本</strong>
        <small>拒绝糊涂账</small>
      </span>
    </div>

    <div class="month-nav">
      <button class="ghost-btn" id="prev-month" title="上个月">‹</button>
      <span id="month-label">—</span>
      <button class="ghost-btn" id="next-month" title="下个月">›</button>
      <button class="back-today is-hidden" id="back-today">回到本月</button>
    </div>

    <button class="primary-btn" id="open-add">
      <span class="plus">＋</span> 记一笔
    </button>
  </header>

  <!-- 首屏：这个月还能花多少 -->
  <section class="hero">
    <div class="gauge-box">
      <svg viewBox="0 0 220 132" class="gauge" role="img" aria-label="本月预算使用进度">
        <path class="gauge-track" d="M25 110 A 85 85 0 0 1 195 110" pathLength="100"/>
        <path class="gauge-fill" id="gauge-fill" d="M25 110 A 85 85 0 0 1 195 110" pathLength="100"/>
      </svg>
      <div class="gauge-center">
        <span class="gauge-label" id="gauge-label">本月还能花</span>
        <strong class="gauge-amount" id="gauge-amount">¥0</strong>
      </div>
    </div>

    <div class="hero-body">
      <p class="hero-eyebrow" id="hero-eyebrow">—</p>
      <p class="hero-verdict" id="hero-verdict">—</p>
      <p class="hero-diagnosis" id="hero-diagnosis">—</p>

      <ul class="hero-facts">
        <li>
          <span>距月底</span>
          <strong id="fact-days">—</strong>
        </li>
        <li>
          <span>每天还能花</span>
          <strong id="fact-perday">—</strong>
        </li>
        <li>
          <span>已记</span>
          <strong id="fact-count">—</strong>
        </li>
        <li>
          <span>本月进账</span>
          <strong class="pos" id="fact-income">—</strong>
        </li>
      </ul>
    </div>
  </section>

  <!-- 两张图 -->
  <div class="grid-2">

    <section class="card">
      <div class="card-head">
        <h2>钱去哪了</h2>
        <span class="card-note">按分类看支出</span>
      </div>
      <div class="donut-wrap">
        <div class="donut" id="donut">
          <div class="donut-hole">
            <span>总支出</span>
            <strong id="donut-total">¥0</strong>
          </div>
        </div>
        <ul class="legend" id="legend"></ul>
      </div>
      <p class="empty" id="donut-empty">这个月还没花钱，或者你已经清空了数据</p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>每天花了多少</h2>
        <span class="card-note" id="bars-note">—</span>
      </div>
      <div class="bars-wrap">
        <div class="bars" id="bars"></div>
        <div class="bars-budget is-hidden" id="bars-budget">
          <span id="bars-budget-label">每天额度</span>
        </div>
      </div>
      <div class="bars-axis" id="bars-axis"></div>
      <p class="tip" id="bars-tip">—</p>
    </section>

  </div>

  <!-- 流水 -->
  <section class="card">
    <div class="card-head">
      <h2>流水</h2>
      <span class="card-note" id="flow-note">—</span>
    </div>
    <div id="flow"></div>
    <div class="empty-state is-hidden" id="flow-empty">
      <p class="empty-title">这个月还是一张白纸</p>
      <p class="empty-sub">记下第一笔，才知道钱是怎么没的</p>
      <button class="ghost-btn solid" id="load-demo">先填一份示例数据看看</button>
    </div>
  </section>

  <footer class="foot">
    <button class="link" id="open-budget">修改月预算（<span id="foot-budget">¥0</span>）</button>
    <span class="dot">·</span>
    <button class="link" id="clear-all">清空所有记录</button>
  </footer>

</main>

<!-- 记一笔 -->
<dialog id="add-dialog" class="sheet">
  <form id="add-form">
    <div class="sheet-head">
      <h3 id="sheet-title">记一笔</h3>
      <button type="button" class="close-btn" data-close>×</button>
    </div>

    <div class="seg" id="type-seg">
      <button type="button" class="seg-btn is-active" data-type="expense">支出</button>
      <button type="button" class="seg-btn" data-type="income">收入</button>
    </div>

    <label class="amount-field">
      <span class="yuan">¥</span>
      <input id="f-amount" type="number" step="0.01" min="0.01" placeholder="0.00"
             inputmode="decimal" autocomplete="off">
    </label>

    <p class="field-label" id="cat-label">花在哪</p>
    <div class="cat-grid" id="cat-grid"></div>

    <div class="row-2">
      <label class="mini-field">
        <span>日期</span>
        <input id="f-date" type="date">
      </label>
      <label class="mini-field">
        <span>备注（可不填）</span>
        <input id="f-note" type="text" maxlength="20" placeholder="食堂三楼">
      </label>
    </div>

    <p class="form-msg" id="form-msg"></p>
    <button type="submit" class="primary-btn wide" id="submit-btn">记下这一笔</button>
  </form>
</dialog>

<!-- 改预算 -->
<dialog id="budget-dialog" class="sheet narrow">
  <form id="budget-form">
    <div class="sheet-head">
      <h3>每月生活费预算</h3>
      <button type="button" class="close-btn" data-close>×</button>
    </div>
    <p class="hint">填家里每月给的钱，或者你打算花的上限。首屏那个"还能花多少"就是拿它算的。</p>
    <label class="amount-field">
      <span class="yuan">¥</span>
      <input id="f-budget" type="number" step="1" min="1" placeholder="1500" inputmode="decimal">
    </label>
    <button type="submit" class="primary-btn wide">保存</button>
  </form>
</dialog>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
